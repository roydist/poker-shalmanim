# Unapproved-player response state machine.
# Personal WhatsApp nudges/roasts for people who are in the group but NOT on Coming.
# Messages are Hebrew, sarcastic, personal. One message per player — never a shared blast.
#
# Tie-in to approvers.yaml (the Coming list for the date in next-match.yaml):
#   Candidate = in the WhatsApp group, and name is NOT in approvers.yaml → coming.
#   Out / TBD / missing from the poll are still candidates if they are not on Coming.
#   When a player appears on Coming, set their state here to approved and stop messaging.
#   Do not invent real שלמנים names, phones, or a match date. Example blocks below are
#   schema samples only — replace with the real roster later (TODO).
#
# Person shape:
#   - name: "Example"
#     phone: null
#     example: true          # drop this flag when swapping in a real player
#     state: pending         # pending | nudged | roasted | approved
#     last_event: null
#     last_messaged_at: null
#     notes:
#       nudge: "personal Hebrew line"
#       roast: "personal Hebrew line"

version: 1
group: שלמנים ב50
coming_source: approvers.yaml
coming_key: coming

# Anyone not in Coming and still in the group is a candidate.
# Terminal: they show up on Coming → state: approved (stop messaging).
states:
  - pending    # not yet messaged
  - nudged     # got their personal nudge
  - roasted    # got their personal roast
  - approved   # terminal — on Coming; do not message

transitions:
  - from: pending
    to: nudged
    on: send_nudge
  - from: nudged
    to: roasted
    on: send_roast
  - from: [pending, nudged, roasted]
    to: approved
    on: player_approved   # fired when they appear on approvers.yaml → coming

# Fallback only. Prefer each player's notes.nudge / notes.roast.
# {name} is replaced with that player's name at send time.
default_messages:
  nudge: |
    {name} — עדיין לא אישרת. השולחן לא ממתין לנצח.
  roast: |
    {name} — אתה חלש.

